<section class="auth-container">
  <div class="auth-card">
    <h1 class="auth-title">Create Account</h1>
    <p class="auth-subtitle">Fill in the details below to get started.</p>

    <form [formGroup]="registerForm" (ngSubmit)="register()" novalidate>

      <div class="form-group">
        <label for="register-name">Full Name</label>
        <input
          id="register-name"
          type="text"
          formControlName="name"
          placeholder="John Doe"
          autocomplete="name"
        />
        <!-- TODO: show validation error messages -->
      </div>

      <div class="form-group">
        <label for="register-email">Email</label>
        <input
          id="register-email"
          type="email"
          formControlName="email"
          placeholder="you@example.com"
          autocomplete="email"
        />
        <!-- TODO: show validation error messages -->
      </div>

      <div class="form-group">
        <label for="register-password">Password</label>
        <input
          id="register-password"
          type="password"
          formControlName="password"
          placeholder="Min. 6 characters"
          autocomplete="new-password"
        />
        <!-- TODO: show validation error messages -->
      </div>

      <div class="form-group">
        <label for="register-confirm-password">Confirm Password</label>
        <input
          id="register-confirm-password"
          type="password"
          formControlName="confirmPassword"
          placeholder="Re-enter password"
          autocomplete="new-password"
        />
        <!-- TODO: add custom validator to check passwords match -->
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        {{ isLoading ? 'Creating account…' : 'Create Account' }}
      </button>

    </form>

    <p class="auth-footer">
      Already have an account?
      <a routerLink="/auth/login">Sign In</a>
    </p>
  </div>
</section>
