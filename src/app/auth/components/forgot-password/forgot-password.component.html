<section class="auth-container">
  <div class="auth-card">
    <h1 class="auth-title">Forgot Password</h1>
    <p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>

    <ng-container *ngIf="!isSubmitted; else confirmation">
      <form [formGroup]="forgotPasswordForm" (ngSubmit)="sendResetLink()" novalidate>

        <div class="form-group">
          <label for="forgot-email">Email</label>
          <input
            id="forgot-email"
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            autocomplete="email"
          />
          <!-- TODO: show validation error messages -->
        </div>

        <button type="submit" class="btn-primary" [disabled]="isLoading">
          {{ isLoading ? 'Sending…' : 'Send Reset Link' }}
        </button>

      </form>
    </ng-container>

    <ng-template #confirmation>
      <p class="success-message">
        <!-- TODO: style the confirmation state properly -->
        ✅ Check your inbox — a reset link has been sent.
      </p>
    </ng-template>

    <p class="auth-footer">
      Remembered it?
      <a routerLink="/auth/login">Back to Sign In</a>
    </p>
  </div>
</section>
